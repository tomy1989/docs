<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="MegaSend Cloud API: one REST API for WhatsApp Business, SMS and more">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFEF7"/>
      <stop offset="55%" stop-color="#F4FCEA"/>
      <stop offset="100%" stop-color="#E8F8D6"/>
    </linearGradient>
